# eslint-disable yaml/no-empty-mapping-value

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2.1.0
        with:
          runtime: node@22
          cache: true
          require-lockfile: true
      - uses: ./.github/actions/setup-zsh
      - uses: ./.github/actions/setup-chezmoi
      - run: pnpm check

  test-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2.1.0
        with:
          runtime: node@22
          cache: true
          require-lockfile: true
      - uses: ./.github/actions/setup-zsh
      - uses: actions/checkout@v7
        with:
          repository: ohmyzsh/ohmyzsh
          path: .cache/ohmyzsh
          persist-credentials: false
      - run: npm install --prefix "$RUNNER_TEMP/corepack" --no-audit --no-fund corepack@0.36.0
        working-directory: ${{ runner.temp }}
      - uses: ./.github/actions/setup-homebrew
      - run: brew bundle install --file=Brewfile --no-upgrade
      - uses: ./.github/actions/setup-chezmoi
      - run: pnpm test:e2e
        env:
          OMZ_SOURCE: ${{ github.workspace }}/.cache/ohmyzsh
          COREPACK_SOURCE: ${{ runner.temp }}/corepack/node_modules/corepack

  test-setup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2.1.0
        with:
          runtime: node@22
          cache: true
          require-lockfile: true
      - if: runner.os == 'Linux'
        run: pnpm test:setup
      - if: runner.os == 'macOS'
        run: PATH="/usr/bin:/bin:/usr/sbin:/sbin:$PATH" pnpm test:setup:macos
    timeout-minutes: 20

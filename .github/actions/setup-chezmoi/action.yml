name: Set up chezmoi
description: Install chezmoi and add it to PATH

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        installer="$(curl -fsLS https://get.chezmoi.io)"
        sh -c "$installer" -- -b "$HOME/.local/bin"
    - shell: bash
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
